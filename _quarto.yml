project:
  type: website
  output-dir: docs

execute:
  freeze: auto

website:
  title: "Alexander Senetcky"
  site-url: https://asenetcky.dev/
  description: "Data scientist and epidemiologist writing about R, open-source tooling, and public health data."

# TODO: create these two images and uncomment.
  #   - favicon.png: 512x512 square, usually a monogram or simple mark on a
  #     solid background. Export to /images/favicon.png.
  #   - og-image.png: 1200x630 social share card. This is what shows up when
  #     a link to any page on the site is pasted into Slack, LinkedIn, etc.
  #     A simple "Alexander Senetcky / asenetcky.dev" on a solid background
  #     works fine. Can be generated from a Figma template or at
  #     https://og-playground.vercel.app/.
  # favicon: images/favicon.png
  # open-graph:
  #   image: /images/og-image.png
  # twitter-card:
  #   image: /images/og-image.png
  #   card-style: summary_large_image

  # Make the RSS feed discoverable to browsers and feed readers via a
  # <link rel="alternate"> tag in every page's <head>.


  navbar:
    pinned: true
    collapse-below: sm
    left:
      - text: "AS"
        href: index.qmd
    right:
      - text: Writing
        href: posts.qmd
      - text: Now
        href: now.qmd
      - text: Projects
        href: projects.qmd
      - text: Talks
        href: presentations.qmd
      - text: About
        href: about.qmd
      - icon: github
        href: https://github.com/asenetcky
        aria-label: GitHub
        target: _blank
      - icon: linkedin
        href: https://www.linkedin.com/in/alexander-senetcky-0b209822
        aria-label: LinkedIn
        target: _blank
      - icon: envelope
        href: mailto:me@asenetcky.dev
        aria-label: Email

  page-footer:
    border: false
    left: "© 2026 Alexander Senetcky"
    center: "[RSS](/posts.xml)"
    right: "Built with [Quarto](https://quarto.org/)"

  draft-mode: unlinked
  repo-url: https://github.com/asenetcky/asenetcky.dev
  repo-actions: [edit, source, issue]

format:
  html:
    include-in-header:
      - text: |
          <link rel="alternate" type="application/rss+xml" title="Alexander Senetcky — Writing" href="https://asenetcky.dev/posts.xml">
    theme:
      light: theme-light.scss
      dark: theme-dark.scss
    css: styles.css
    toc: true
    toc-location: right
    toc-depth: 3
    page-layout: article
    fontsize: 1rem
    linestretch: 1.65
    anchor-sections: true
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    highlight-style:
      light: github
      dark: github-dark

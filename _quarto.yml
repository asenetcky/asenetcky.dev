project:
  type: website
  output-dir: docs

execute:
  freeze: auto

website:
  title: "Alexander Senetcky"
  site-url: https://asenetcky.dev/
  description: "Data scientist and epidemiologist writing about R, open-source tooling, and public health data."

  navbar:
    pinned: true
    collapse-below: sm
    left:
      - text: "AS"
        href: index.qmd
    right:
      - text: Writing
        href: posts.qmd
      - text: Projects
        href: projects.qmd
      - text: Talks
        href: presentations.qmd
      - text: About
        href: about.qmd
      - icon: github
        href: https://github.com/asenetcky
        aria-label: GitHub
        target: _blank
      - icon: linkedin
        href: https://www.linkedin.com/in/alexander-senetcky-0b209822
        aria-label: LinkedIn
        target: _blank
      - icon: envelope
        href: mailto:me@asenetcky.dev
        aria-label: Email

  page-footer:
    border: false
    left: "© 2026 Alexander Senetcky"
    right: "Built with [Quarto](https://quarto.org/)"

  draft-mode: unlinked
  repo-url: https://github.com/asenetcky/asenetcky.dev
  repo-actions: [edit, source, issue]

format:
  html:
    theme:
      light: theme-light.scss
      dark: theme-dark.scss
    css: styles.css
    toc: true
    toc-location: right
    toc-depth: 3
    page-layout: article
    fontsize: 1rem
    linestretch: 1.65
    anchor-sections: true
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    highlight-style:
      light: github
      dark: github-dark
